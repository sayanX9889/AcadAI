<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AcadAI Advisor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>


<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- LOGO / TITLE -->
        <div class="text-center mb-8">

            <div
                class="mx-auto mb-4 grid h-16 w-16
                place-items-center rounded-2xl
                bg-indigo-600 text-white text-2xl"
            >
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1 class="text-3xl font-bold text-white">
                Create Account
            </h1>

            <p class="mt-2 text-sm text-slate-400">
                Join AcadAI Advisor
            </p>

        </div>


        <!-- SIGNUP CARD -->
        <div
            class="rounded-2xl border border-slate-800
            bg-slate-900 p-6 shadow-2xl"
        >

            <form id="signup-form" class="space-y-5">

                <!-- FULL NAME -->
                <div>

                    <label
                        for="full-name"
                        class="mb-2 block text-sm font-medium
                        text-slate-300"
                    >
                        Full Name
                    </label>

                    <input
                        id="full-name"
                        type="text"
                        required
                        autocomplete="name"
                        placeholder="Enter your full name"
                        class="w-full rounded-xl border
                        border-slate-700 bg-slate-950
                        px-4 py-3 text-white outline-none
                        transition focus:border-indigo-500"
                    >

                </div>


                <!-- STUDENT ID -->
                <div>

                    <label
                        for="student-id"
                        class="mb-2 block text-sm font-medium
                        text-slate-300"
                    >
                        Student ID
                    </label>

                    <input
                        id="student-id"
                        type="text"
                        required
                        autocomplete="username"
                        placeholder="Example: STU0001"
                        class="w-full rounded-xl border
                        border-slate-700 bg-slate-950
                        px-4 py-3 text-white uppercase
                        outline-none transition
                        focus:border-indigo-500"
                    >

                </div>


                <!-- EMAIL -->
                <div>

                    <label
                        for="email"
                        class="mb-2 block text-sm font-medium
                        text-slate-300"
                    >
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="student@gmail.com"
                        class="w-full rounded-xl border
                        border-slate-700 bg-slate-950
                        px-4 py-3 text-white outline-none
                        transition focus:border-indigo-500"
                    >

                </div>


                <!-- PASSWORD -->
                <div>

                    <label
                        for="password"
                        class="mb-2 block text-sm font-medium
                        text-slate-300"
                    >
                        Password
                    </label>

                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Minimum 6 characters"
                            class="w-full rounded-xl border
                            border-slate-700 bg-slate-950
                            px-4 py-3 pr-12 text-white outline-none
                            transition focus:border-indigo-500"
                        >
                        <button type="button"
                            onclick="togglePassword('password', 'password-eye')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
                            aria-label="Show password">
                            <i id="password-eye" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div>

                    <label
                        for="confirm-password"
                        class="mb-2 block text-sm font-medium
                        text-slate-300"
                    >
                        Confirm Password
                    </label>

                    <div class="relative">
                        <input
                            id="confirm-password"
                            type="password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Enter password again"
                            class="w-full rounded-xl border
                            border-slate-700 bg-slate-950
                            px-4 py-3 pr-12 text-white outline-none
                            transition focus:border-indigo-500"
                        >
                        <button type="button"
                            onclick="togglePassword('confirm-password', 'confirm-password-eye')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
                            aria-label="Show password">
                            <i id="confirm-password-eye" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                </div>


                <!-- MESSAGE -->
                <div
                    id="message"
                    class="hidden rounded-xl px-4 py-3
                    text-sm"
                ></div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    id="signup-button"
                    class="w-full rounded-xl bg-indigo-600
                    px-4 py-3 font-semibold text-white
                    transition hover:bg-indigo-500
                    disabled:cursor-not-allowed
                    disabled:opacity-60"
                >
                    <i class="fa-solid fa-user-plus mr-2"></i>
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->
            <div
                class="mt-6 border-t border-slate-800
                pt-5 text-center text-sm"
            >

                <span class="text-slate-400">
                    Already have an account?
                </span>

                <a
                    href="login.html"
                    class="ml-1 font-semibold text-indigo-400
                    hover:text-indigo-300"
                >
                    Sign In
                </a>

            </div>

        </div>

    </div>


<script>
const API_URL = "https://acad-ai-backend-6494.onrender.com";

function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

function isValidEmail(email) {
    const emailPattern =
        /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+$/;
    return emailPattern.test(email);
}

const form = document.getElementById("signup-form");
const message = document.getElementById("message");
const button = document.getElementById("signup-button");

function showMessage(text, type) {
    message.textContent = text;
    message.classList.remove(
        "hidden",
        "bg-red-500/10",
        "text-red-400",
        "bg-green-500/10",
        "text-green-400"
    );

    if (type === "error") {
        message.classList.add("bg-red-500/10", "text-red-400");
    } else {
        message.classList.add("bg-green-500/10", "text-green-400");
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const studentId = document.getElementById("student-id").value.trim().toUpperCase();
    const fullName = document.getElementById("full-name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (!studentId) {
        showMessage("Student ID is required.", "error");
        return;
    }

    if (!fullName) {
        showMessage("Full name is required.", "error");
        return;
    }

    if (!isValidEmail(email)) {
        showMessage("Please enter a valid email address.", "error");
        return;
    }

    if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
    }

    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Creating Account...';

    try {
        const response = await fetch(`${API_URL}/auth/signup`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                student_id: studentId,
                full_name: fullName,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            showMessage(data.error || "Unable to create account.", "error");
            button.disabled = false;
            button.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i>Create Account';
            return;
        }

        showMessage("Account created successfully. Redirecting to login...", "success");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

    } catch (error) {
        console.error(error);
        showMessage(
            "Cannot connect to the server. Make sure FastAPI is running.",
            "error"
        );
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i>Create Account';
    }
});
</script>

</body>
</html>
